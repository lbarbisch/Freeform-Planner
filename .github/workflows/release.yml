name: Release

# Runs only after CI succeeded on a pushed v*.*.* tag. CI does all checks and tests; the release
# publishes exactly the build artifact CI tested and does no testing or building of its own.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write   # create GitHub Releases and upload assets
  actions: read     # download the build artifact from the CI run
  pages: write      # deploy the web app
  id-token: write

jobs:
  # ------------------------------------------------------------------ v0.2+ web app (v0.1.x were the Python app)
  web:
    name: Publish the web app
    # for a tag push, head_branch is the tag name
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !startsWith(github.event.workflow_run.head_branch, 'v0.1.')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag must exist, point at the tested commit and match package.json version
        run: |
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git rev-list -n 1 "refs/tags/$TAG")" != "$SHA" ]; then
            echo "::error::tag $TAG does not point at the CI-tested commit $SHA"
            exit 1
          fi
          version="v$(node -p "require('./app/package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      # exactly the build that CI type-checked, unit-tested and end-to-end tested
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip the static site
        run: cd dist && zip -r "../Freeform-Planner-$TAG-web.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }}"
          files: Freeform-Planner-${{ env.TAG }}-web.zip
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
