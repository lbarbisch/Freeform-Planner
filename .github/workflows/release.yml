name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Releases and upload assets
  pages: write      # deploy the web app
  id-token: write

jobs:
  # ------------------------------------------------------------------ 2.0+ web app
  web:
    name: Test and build the web app
    if: ${{ !startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

      # the full end-to-end suite runs against the exact files that get released;
      # screenshot baselines must exist (no --update-snapshots here)
      - run: npx playwright install --with-deps
      - run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report

      - name: Zip the static site
        run: cd dist && zip -r "../Freeform-Planner-${{ github.ref_name }}-web.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: app/Freeform-Planner-${{ github.ref_name }}-web.zip
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ v0.x Python app
  python-test:
    name: Run Python tests before release
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -ra -q

  build-exe:
    name: Build Windows exe
    needs: python-test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies + PyInstaller
        run: |
          uv sync --all-extras
          uv pip install pyinstaller

      - name: Build exe with PyInstaller
        run: uv run python -m PyInstaller Planner.spec --noconfirm

      - name: Zip the output folder
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "Freeform-Planner-$version-windows.zip"
          Compress-Archive -Path "dist\Freeform-Planner\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
