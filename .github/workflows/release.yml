name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Releases and upload assets
  pages: write      # deploy the web app
  id-token: write

jobs:
  # ------------------------------------------------------------------ v0.2+ web app (v0.1.x were the Python app)
  web:
    name: Test and build the web app
    if: ${{ !startsWith(github.ref_name, 'v0.1.') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

      # the full end-to-end suite runs against the exact files that get released;
      # screenshot baselines must exist (no --update-snapshots here)
      - run: npx playwright install --with-deps
      # Firefox has no built-in software WebGL: run it headed in Xvfb on Mesa's llvmpipe (see ci.yml)
      - run: sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgl1-mesa-dri libgbm1
      - name: Run end-to-end tests
        run: |
          npx playwright test --project=chromium --project=webkit
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npx playwright test --project=firefox --headed
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report

      - name: Zip the static site
        run: cd dist && zip -r "../Freeform-Planner-${{ github.ref_name }}-web.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: app/Freeform-Planner-${{ github.ref_name }}-web.zip
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
