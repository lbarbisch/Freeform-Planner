name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 2.0 web app
  web-checks:
    name: Web – typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run coverage
      - run: npm run build

      - name: Upload build (preview of this commit)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist
          retention-days: 14

  web-e2e:
    name: Web – end-to-end (${{ matrix.browser }})
    needs: web-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # e2e tests run against exactly the build artifact that was checked above
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: app/dist

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # Screenshot baselines are per platform. Missing Linux baselines are created on the first
      # run and uploaded below; commit them to make the comparison strict from then on.
      - run: npx playwright test --project=${{ matrix.browser }} --update-snapshots=missing
        env:
          CI: "true"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: app/playwright-report
          retention-days: 14

      - name: Upload new screenshot baselines
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines-linux
          path: app/tests/e2e/__screenshots__/linux
          if-no-files-found: ignore

  # ------------------------------------------------------------------ v0.1.x Python app + converters
  python:
    name: Python ${{ matrix.python-version }} – legacy app and converters
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -ra -q
