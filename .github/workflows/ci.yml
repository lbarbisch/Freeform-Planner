name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 2.0 web app
  web-checks:
    name: Web – typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run coverage
      - run: npm run build

      - name: Upload build (preview of this commit)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist
          retention-days: 14

  web-e2e:
    name: Web – end-to-end (${{ matrix.browser }})
    needs: web-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # e2e tests run against exactly the build artifact that was checked above
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: app/dist

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # Firefox (unlike Chromium/WebKit) has no built-in software WebGL. On the GPU-less runner
      # headless Firefox finds no GL driver at all, so it runs headed inside a virtual X display
      # (Xvfb) where Mesa's software renderer (llvmpipe) provides OpenGL.
      - if: ${{ matrix.browser == 'firefox' }}
        run: sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgl1-mesa-dri libgbm1

      - name: Check WebGL
        run: |
          node tools/webgl-check.ts ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = firefox ]; then
            HEADED=1 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node tools/webgl-check.ts firefox
          fi

      # Screenshot baselines are per platform. Missing Linux baselines are created on the first
      # run and uploaded below; commit them to make the comparison strict from then on.
      - name: Run end-to-end tests
        run: |
          if [ "${{ matrix.browser }}" = firefox ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              npx playwright test --project=firefox --update-snapshots=missing --headed
          else
            npx playwright test --project=${{ matrix.browser }} --update-snapshots=missing
          fi
        env:
          CI: "true"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: app/playwright-report
          retention-days: 14

      - name: Upload new screenshot baselines
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines-linux
          path: app/tests/e2e/__screenshots__/linux
          if-no-files-found: ignore